service: sqs-processor-second

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  memorySize: 128
  timeout: 10
  environment:
    SECRET_KEY: ${env:SECRET_KEY}
    RPC_URL: ${env:RPC_URL}
    DATABASE_URL: ${env:DATABASE_URL}
    CONTRACT_ADDRESS: ${env:CONTRACT_ADDRESS}

plugins:
  - serverless-dotenv-plugin  # Loads environment variables from .env

functions:
  sqsProcessor:
    handler: handler.sqsProcessor
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:643105839968:MyQueue.fifo
          batchSize: 1
